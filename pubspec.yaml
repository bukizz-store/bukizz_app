name: bukizz
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1.1

environment:
  sdk: ">=3.1.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ICONS
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # FIREBASE
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_database: ^11.0.1
  firebase_messaging: ^15.0.1

  # AUTH
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0 # Your original version 7.0.1 may be correct for your SDK. Revert if you see errors.
  email_auth: ^1.1.1
  mailer: ^6.0.1

  # STATE MANAGEMENT
  provider: ^6.1.2

  # LOCAL STORAGE
  shared_preferences: ^2.2.2

  # UI & WIDGETS
  dots_indicator: ^3.0.0
  carousel_slider: ^5.1.1 # Your original version 5.1.1 may be correct for your SDK. Revert if you see errors.
  otp_text_field: ^1.1.3
  curved_navigation_bar: ^1.0.3
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  awesome_snackbar_content: ^0.1.3

  # IMAGES & ASSETS
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # UTILITIES
  crypto: ^3.0.3
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  responsive_sizer: ^3.3.1
  intl: 0.20.2 # <-- CORRECTED VERSION

  # NOTIFICATIONS
  flutter_local_notifications: ^19.4.1 # Your original version 19.4.1 may be correct for your SDK. Revert if you see errors.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito/Nunito-Regular.ttf
        - asset: fonts/Nunito/Nunito-Bold.ttf
        - asset: fonts/Nunito/Nunito-Italic.ttf
        - asset: fonts/Nunito/Nunito-BoldItalic.ttf

  assets:
    - assets/
    - assets/checkout/
    - assets/category/
    - assets/school/
    - assets/payment/
    - assets/onboarding/
    - assets/stationary/
    - assets/uniform/
    - assets/tab icons/
    - assets/school/booksets/
    - assets/cart/
    - assets/images/
    - assets/ecommerce home/
    - assets/ecommerce home/icons/
    - assets/ecommerce home/tab icons/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
